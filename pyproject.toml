[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmadt"
version = "0.1.0"
description = "Agentic AI framework integrating digital twin simulation, cryptographic provenance, and federated learning for resilient drug supply chains"
readme = "README.md"
# The guide specifies 3.11; 3.12 is verified working for the full pin set on
# Windows. Capped below 3.13 because Prophet and PyTorch 2.4 have no wheels there.
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["pharmadt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: full-length runs used to verify a stage's Definition of Done",
]

[tool.coverage.run]
source = ["pharmadt"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# NFR-07 requires 80%.
show_missing = true
exclude_also = [
    # Argparse entry points. These parse flags and print; the functions they
    # call are exercised directly by tests/test_harness_smoke.py, which runs
    # every harness end to end at a small size. Counting argument parsing as
    # untested behaviour would push toward writing tests for argparse rather
    # than for the project.
    'if __name__ == "__main__":',
    "def main\\(\\) -> None:",
    # Defensive branches that only fire on an unreachable state.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is exactly how
# FastAPI declares dependencies and query parameters. These three are the
# documented pattern and are evaluated once at import, not per request, so the
# mutable-default hazard B008 exists to catch does not apply.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]
