# Stage 0 brings up the database only. The `api` and `dashboard` services are
# added in Stage 14, at which point `docker compose up` must stand the whole
# system up from a clean checkout (Stage 15 packaging requirement).

services:
  db:
    image: postgres:15
    container_name: pharmadt-db
    environment:
      POSTGRES_USER: pharmadt
      POSTGRES_PASSWORD: pharmadt
      POSTGRES_DB: pharmadt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `make db-up` block until Postgres actually accepts connections,
    # rather than racing the smoke test against a container that is up but
    # not yet listening.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmadt -d pharmadt"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: pharmadt-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable by service name,
      # not on localhost — that is the one setting that differs from a local run.
      DATABASE_URL: postgresql+psycopg2://pharmadt:pharmadt@db:5432/pharmadt
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-only-not-a-production-secret}
    ports:
      - "8000:8000"
    # The schema has to exist before the API serves anything, and a fresh
    # volume has no tables. Migrating on start makes `docker compose up` work
    # on a clean checkout, which is the Stage 15 packaging requirement.
    command: >
      sh -c "alembic upgrade head &&
             python -m pharmadt.core.seed || true &&
             uvicorn pharmadt.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
